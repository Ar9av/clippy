name: Release DMG

# Publishes the universal DMG as a release asset. Runs when a release is
# published, and can be run by hand against any ref to check the packaging
# without cutting a release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_tag:
        description: "Optional existing tag to attach the DMG to (leave blank to only build)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    # macos-15 for the toolchain, not the hardware: a transitive dependency
    # (swift-argument-parser 1.8.2, via WhisperKit) declares Swift tools 6.0,
    # and the macos-14 image ships Swift 5.10, which fails at resolve time.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Pin explicitly rather than trusting the image default, so a runner
      # image update cannot silently drop the toolchain back below 6.0.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show toolchain
        run: |
          swift --version
          swift package tools-version

      # Dependencies dominate a cold build; keying on Package.resolved means the
      # cache is reused until a dependency actually changes.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # The app reads the compiled JSON, not the YAML, so a policy edit that
      # skipped the compile step would ship a guardrail that silently doesn't
      # match what the source of truth says. Recompile and fail on any diff.
      # The runner's python3 is Homebrew-managed, so PEP 668 refuses a plain
      # `pip3 install`. A throwaway venv on GITHUB_PATH gives every later step
      # the `python3` the compiler asks for — build-dmg.sh runs it too, so the
      # venv has to outlive the check step below.
      - name: Set up Python for the policy compiler
        run: |
          python3 -m venv "$RUNNER_TEMP/policy-venv"
          "$RUNNER_TEMP/policy-venv/bin/pip" install --quiet pyyaml
          echo "$RUNNER_TEMP/policy-venv/bin" >> "$GITHUB_PATH"

      - name: Check the Prismor policy is compiled
        run: |
          ./scripts/compile-policy.sh
          git diff --exit-code Sources/ClippyCore/Resources/prismor-policy.json \
            || { echo "::error::prismor-policy.json is stale — run ./scripts/compile-policy.sh"; exit 1; }

      - name: Test
        run: swift test

      # The offline eval replays recorded fixtures, so it needs no API key and
      # is deterministic in CI. It is the safety-suite regression gate.
      - name: Safety eval
        run: swift run clippy-eval --offline

      # Without a Developer ID in secrets the script falls back to ad-hoc
      # signing, which still produces a working DMG — it just shows a Gatekeeper
      # warning on first open. Set CODESIGN_IDENTITY (plus the cert in the
      # keychain) to sign it properly.
      - name: Build DMG
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh

      # The whole point of the DMG is that it runs on both architectures, and a
      # missing slice is otherwise only discovered by an Intel user.
      - name: Verify universal binary
        run: |
          ARCHS="$(lipo -archs build/Clippy.app/Contents/MacOS/Clippy)"
          echo "archs: $ARCHS"
          for required in arm64 x86_64; do
            case " $ARCHS " in
              *" $required "*) ;;
              *) echo "::error::DMG is missing the $required slice (got: $ARCHS)"; exit 1 ;;
            esac
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clippy-macOS-universal
          path: build/Clippy-macOS-universal.dmg
          if-no-files-found: error

      - name: Attach DMG to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            build/Clippy-macOS-universal.dmg --clobber

      - name: Attach DMG to a tag chosen by hand
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.upload_to_tag }}" \
            build/Clippy-macOS-universal.dmg --clobber
